name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: false
        type: string
      bump_type:
        description: "Version bump type (if version not specified)"
        default: "patch"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-cores:
    name: Build Core (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [tg5040, tg5050, h700]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ${{ matrix.platform }} core
        run: |
          make build-${{ matrix.platform }}

      - name: Fix file permissions for upload
        run: sudo chown -R $USER:$USER build/cores

      - name: Upload ${{ matrix.platform }} core
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.platform }}
          path: build/cores/${{ matrix.platform }}/flycastrophe_libretro.so

  release:
    name: Package and Release
    runs-on: ubuntu-24.04
    needs: build-cores

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            CURRENT=$(jq -r .version pak.json)
            IFS='.' read -r major minor patch <<< "$CURRENT"
            case "${{ github.event.inputs.bump_type }}" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              *)
                patch=$((patch + 1))
                ;;
            esac
            VER="${major}.${minor}.${patch}"
          fi
          echo "VERSION=$VER" >> $GITHUB_OUTPUT
          echo "Selected release version: $VER"

      - name: Download tg5040 core
        uses: actions/download-artifact@v4
        with:
          name: core-tg5040
          path: build/cores/tg5040

      - name: Download tg5050 core
        uses: actions/download-artifact@v4
        with:
          name: core-tg5050
          path: build/cores/tg5050

      - name: Download h700 core
        uses: actions/download-artifact@v4
        with:
          name: core-h700
          path: build/cores/h700

      - name: Ensure executable permissions
        run: chmod +x build/cores/*/flycastrophe_libretro.so launch.sh

      - name: Bump version in pak.json
        run: make bump-version RELEASE_VERSION="${{ steps.get_version.outputs.VERSION }}"

      - name: Build release packages
        run: make package

      - name: Create Git Tag (for workflow_dispatch)
        if: startsWith(github.ref, 'refs/tags/') != true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -am "chore(release): v${{ steps.get_version.outputs.VERSION }}" || true
          git tag "v${{ steps.get_version.outputs.VERSION }}"
          git push origin "v${{ steps.get_version.outputs.VERSION }}"
          git push origin main

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.VERSION }}"
          name: "v${{ steps.get_version.outputs.VERSION }}"
          files: dist/DC.pak.zip
          generate_release_notes: true
          make_latest: true
